[project]
name = "mugi-fixed-topology"
version = "0.1.0"
description = "Reproducible fixed-topology preparation and QA for Mugi Live2D"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "psd-tools>=1.14,<2",
  "scipy>=1.14,<2",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
